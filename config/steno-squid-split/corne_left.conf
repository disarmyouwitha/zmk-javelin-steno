CONFIG_ZMK_KEYBOARD_NAME="Steno Squid Split"
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_STENO_SQUID_SPLIT_STATUS=y
CONFIG_ZMK_STENO_SQUID_PRACTICE=y
CONFIG_ZMK_STENO_SQUID_STROKE_TAPE=y
# Shorter-outline hints search the dictionaries on every stroke. Turn them on
# after the logging build shows the time per stroke.
# CONFIG_ZMK_STENO_SQUID_STROKE_HINT=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_JAVELIN_STENO=y
CONFIG_ZMK_JAVELIN_STENO_DICT_PLOVER=n
CONFIG_ZMK_JAVELIN_STENO_DICT_LAPWING=n
CONFIG_ZMK_JAVELIN_STENO_EXTERNAL_LAPWING=y
CONFIG_ZMK_JAVELIN_STENO_BROWSER_DICTIONARY=y
# The dictionary flash powers down after 30 idle seconds on the typing and
# Plover HID layers. It stays on while the steno layer is selected. Selecting
# that layer starts it again, and so does an editor command. To compare
# battery life with the flash always on, uncomment the first line.
# CONFIG_ZMK_JAVELIN_STENO_FLASH_IDLE_OFF=n
# CONFIG_ZMK_JAVELIN_STENO_FLASH_IDLE_SECONDS=30
# ZMK Studio is on and starts unlocked, so no unlock key is needed. It works
# over Bluetooth in every build. For Studio over USB, build with
# -S studio-rpc-usb-uart.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_JAVELIN_STENO_BLE_HID=y
# A 63-byte editor report plus the ATT notification header needs an MTU of 66.
CONFIG_BT_L2CAP_TX_MTU=80
CONFIG_BT_BUF_ACL_RX_SIZE=84
CONFIG_ZMK_JAVELIN_STENO_MACOS_US_LAYOUT=y
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y

CONFIG_ZMK_HID_IO=y
CONFIG_ZMK_HID_IO_PLOVER_HID=y
CONFIG_USB_HID_DEVICE_COUNT=3
CONFIG_HID_INTERRUPT_EP_MPS=64
