# Nice!nano v2 internal-flash translation test; tiny dictionary only.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_JAVELIN_STENO=y
CONFIG_ZMK_JAVELIN_STENO_DICT_PLOVER=n
CONFIG_ZMK_JAVELIN_STENO_DICT_LAPWING=n
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_HEAP_MEM_POOL_SIZE=32768
# No display in this first translation test.
CONFIG_ZMK_DISPLAY=n

# Additional USB Plover HID interface, as in the Zen configuration.
CONFIG_ZMK_HID_IO=y
CONFIG_ZMK_HID_IO_PLOVER_HID=y
