CONFIG_ZMK_KEYBOARD_NAME="Zen R4 Split"
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_JAVELIN_STENO=y
CONFIG_ZMK_JAVELIN_STENO_DICT_PLOVER=n
CONFIG_ZMK_JAVELIN_STENO_DICT_LAPWING=n
CONFIG_ZMK_JAVELIN_STENO_EXTERNAL_LAPWING=y
CONFIG_ZMK_JAVELIN_STENO_BROWSER_DICTIONARY=y
CONFIG_ZMK_JAVELIN_STENO_BLE_HID=y
# A 63-byte editor report plus the ATT notification header needs an MTU of 66.
CONFIG_BT_L2CAP_TX_MTU=80
CONFIG_BT_BUF_ACL_RX_SIZE=84
CONFIG_ZMK_JAVELIN_STENO_MACOS_US_LAYOUT=y
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y

CONFIG_ZMK_HID_IO=y
CONFIG_ZMK_HID_IO_PLOVER_HID=y
CONFIG_USB_HID_DEVICE_COUNT=3
CONFIG_HID_INTERRUPT_EP_MPS=64
